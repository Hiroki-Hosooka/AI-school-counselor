<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>相談ログ レビュー画面</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
:root{
  --paper:#FBFAF7; --ink:#232A2E; --ink-soft:#5C6A70; --ink-faint:#8B979C;
  --indigo:#2F4858; --moss:#6E8B74; --plum:#7A6480; --amber:#A8794A;
  --sand:#E4E0D6; --sand-deep:#D3CDBF;
  --alert:#A8443A; --alert-bg:#FBF1EF;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;
  font-size:14.5px;line-height:1.75}
header{border-bottom:1px solid var(--sand);padding:14px 20px;background:var(--paper);
  position:sticky;top:0;z-index:5}
.head-row{display:flex;align-items:baseline;gap:12px;max-width:920px;margin:0 auto;width:100%}
.mark{font-size:17px;font-weight:600;color:var(--indigo)}
.sub{font-size:11.5px;color:var(--ink-faint)}
.spacer{flex:1}
button{font-family:inherit;cursor:pointer}
.icon-btn{background:none;border:1px solid var(--sand);border-radius:999px;color:var(--ink-soft);
  font-size:11.5px;padding:5px 13px}
.icon-btn:hover{border-color:var(--ink-faint);color:var(--ink)}
main{max-width:920px;margin:0 auto;padding:22px 20px 60px}

.notice{border:1px solid var(--sand-deep);background:#fff;border-radius:9px;padding:14px 16px;
  font-size:13px;line-height:1.85;margin-bottom:16px;color:var(--ink-soft)}
.notice.warn{border-color:#E8CFC9;background:var(--alert-bg);color:var(--alert)}
.notice code{background:#F6F5F1;border:1px solid var(--sand);border-radius:5px;padding:1px 6px;font-size:12px}

.toolbar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.sort-tabs{display:flex;gap:6px}
.sort-tab{border:1px solid var(--sand);background:#fff;border-radius:999px;padding:6px 14px;
  font-size:12.5px;color:var(--ink-soft)}
.sort-tab.on{border-color:var(--indigo);color:var(--indigo);font-weight:600}
.count{font-size:12px;color:var(--ink-faint)}
/* ログの出力(2026年11月1日)。形式(md・txt・PDF)と中身(内部の判定つき・画面に出たやり取りだけ)を選ぶ */
.export-box{display:inline-flex;flex-wrap:wrap;gap:8px;align-items:center;margin-left:6px;font-size:11.5px;color:var(--ink-soft)}
.export-box select{font-family:inherit;font-size:11.5px;padding:3px 6px;border:1px solid var(--sand);border-radius:6px;background:#fff;color:var(--ink)}
.low-pri-toggle{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink-faint);
  margin:-4px 0 12px;cursor:pointer}
.low-pri-toggle input{margin:0}

.s-list{display:flex;flex-direction:column;gap:10px}
.s-card{border:1px solid var(--sand);background:#fff;border-radius:10px;padding:13px 16px;cursor:pointer}
.s-card:hover{border-color:var(--ink-faint)}
.s-card.crisis{border-color:var(--alert);background:var(--alert-bg)}
.s-card-top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.s-id{font-family:ui-monospace,monospace;font-size:12.5px;color:var(--ink-soft)}
.s-card-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.s-card-time{font-size:11.5px;color:var(--ink-faint)}
.empty{text-align:center;color:var(--ink-faint);padding:40px 0;font-size:13.5px}

.badge{display:inline-block;font-size:10.5px;letter-spacing:.03em;padding:2px 9px;border-radius:999px;
  background:var(--sand);color:var(--ink-soft)}
.badge.warn{background:var(--alert);color:#fff}
.badge.open{background:var(--indigo);color:#fff}

.tag{display:inline-block;font-size:11px;letter-spacing:.03em;padding:2px 9px;border-radius:999px;
  border:1px solid var(--sand-deep);color:var(--ink-faint)}
.tag.warn{border-color:var(--alert);color:var(--alert)}
.tag.amber{border-color:var(--amber);color:var(--amber)}
.discomfort-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px;font-size:12px}
.discomfort-row button{font-size:11.5px;padding:2px 9px;border-radius:999px;border:1px solid var(--sand-deep);background:transparent;color:inherit;cursor:pointer}
.discomfort-row button.on{border-color:var(--alert);color:var(--alert)}
.discomfort-row .disc-note{flex:1 1 140px;min-width:0;font-size:12px;padding:3px 6px}
.msg.ai.discomfort .bubble{outline:2px dashed var(--alert);outline-offset:2px}

#detailView .s-header{margin:14px 0 6px}
#detailView .s-header h3{margin:0 0 6px;font-size:16px;color:var(--indigo)}
.notes-block{border-top:1px solid var(--sand);border-bottom:1px solid var(--sand);
  padding:10px 0;margin:10px 0 18px}
.notes-block h5{margin:0 0 8px;font-size:11px;letter-spacing:.06em;color:var(--ink-faint);font-weight:600}
.notes-block dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:12.5px}
.notes-block dt{color:var(--ink-faint)}
.notes-block dd{margin:0;color:var(--ink-soft)}

.thread{display:flex;flex-direction:column;gap:20px}
.msg.user{display:flex;justify-content:flex-end}
.batch-head{font-size:11px;color:var(--ink-faint, #8a8a8a);text-align:right;margin:10px 0 2px}
.batch-meta{font-size:10.5px;color:var(--ink-faint, #8a8a8a);text-align:right;margin:-4px 0 6px}
.msg.user .bubble{background:var(--indigo);color:#F4F6F5;border-radius:12px 12px 2px 12px;
  padding:9px 14px;font-size:13.5px;max-width:80%;white-space:pre-wrap}
.msg.ai{border-left:2px solid var(--sand-deep);padding-left:14px}
.msg.ai.crisis{border-left-color:var(--alert)}
.msg.ai .bubble{font-size:14.5px;line-height:1.9;white-space:pre-wrap;margin-bottom:8px}
.meta{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
.hint{font-size:12px;color:var(--ink-soft);margin-bottom:4px}
.hint b{color:var(--ink-faint);font-weight:600}
.flags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}

.know-list{margin:6px 0;display:flex;flex-direction:column;gap:6px}
.know-item{font-size:11.5px;line-height:1.7;color:var(--ink-soft);border-left:2px solid var(--sand);
  padding:2px 0 2px 10px}
.know-item code{display:block;font-size:10.5px;color:var(--plum);letter-spacing:.02em;margin-bottom:1px}

.rate-row{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.rate-row>span:first-child{font-size:11px;color:var(--ink-faint);margin-right:2px}
.rate-btn{width:24px;height:24px;border-radius:50%;border:1px solid var(--sand-deep);background:#fff;
  color:var(--ink-faint);font-size:11.5px;padding:0}
.rate-btn.on{background:var(--moss);border-color:var(--moss);color:#fff}
.rate-comment{border:1px solid var(--sand-deep);border-radius:7px;padding:5px 9px;font-size:12px;
  font-family:inherit;min-width:180px;flex:1}
.rate-save{border:1px solid var(--indigo);background:var(--indigo);color:#fff;border-radius:7px;
  padding:5px 13px;font-size:12px}
.rate-save:disabled{opacity:.5;cursor:default}
.rate-saved{font-size:11.5px;color:var(--moss)}

.foot-note{max-width:920px;margin:26px auto 0;font-size:11px;color:var(--ink-faint);
  border-top:1px solid var(--sand);padding-top:12px}
  .model-health { font-size:12px; color:var(--ink-soft); background:var(--sand); border-radius:6px; padding:6px 10px; margin:6px 0 10px; line-height:1.6; }
  .model-health.warn { color:var(--alert); background:var(--alert-bg); font-weight:600; }
</style>
</head>
<body>
<header>
  <div class="head-row">
    <span class="mark">相談ログ レビュー</span>
    <span class="sub">心理士専用・このページのURLを共有しないでください</span>
    <span class="sub" id="appVersion" title="いま動いているアプリの版(src/version.mjs)とデプロイしたコミット"></span>
    <span class="spacer"></span>
    <a class="icon-btn" href="/knowledge.html" style="text-decoration:none">ナレッジ管理</a>
    <button id="refreshBtn" class="icon-btn">更新</button>
  </div>
</header>
<main>
  <form id="loginForm" class="notice" hidden>
    <p style="margin:0 0 10px">このページを開くには、合言葉を入力してください。
      合言葉は <code>ADMIN_TOKEN</code> として管理者がVercelに設定した値です。</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <input type="password" id="tokenInput" class="rate-comment" autocomplete="current-password"
        placeholder="合言葉" style="min-width:220px">
      <button type="submit" class="rate-save">入る</button>
    </div>
  </form>
  <div id="authError" class="notice warn" hidden>
    合言葉が違います。もう一度入力してください。
  </div>
  <div id="loadError" class="notice warn" hidden></div>

  <section id="listView" hidden>
    <div class="toolbar">
      <div class="sort-tabs">
        <button type="button" class="sort-tab on" data-sort="new">新しい順</button>
        <button type="button" class="sort-tab" data-sort="unrated">未評価が多い順</button>
      </div>
      <span id="listCount" class="count"></span>
    </div>
    <label class="low-pri-toggle">
      <input type="checkbox" id="showLowPriority">
      <span id="lowPriorityLabel">やり取り0件、または3往復以下で進展が無く危機でもないセッションを隠す</span>
    </label>
    <label class="low-pri-toggle">
      <input type="checkbox" id="showSynthetic">
      <span id="syntheticLabel">合成データ(ペルソナテスト)を表示する</span>
    </label>
    <div id="keyGuard" class="model-health" hidden></div>
    <div id="modelHealth" class="model-health" hidden title="生成のモデルの状態(直近1時間・24時間)。429 はキーの上限、切り替えは予備のモデルへ移った回数、失敗は固定の一言で受けた回数、作り直し待ちは返事を作れず画面が時間をおいて作り直した発言の数、失敗の内訳は生成の失敗の種類ごとの数、時間は返事にかかった時間の中央値"></div>
    <div id="sessionList" class="s-list"></div>
    <div id="listEmpty" class="empty" hidden>まだセッションがありません。</div>
  </section>

  <section id="detailView" hidden>
    <button type="button" id="backBtn" class="icon-btn">← 一覧へ</button>
    <span class="export-box">
      <label>形式
        <select id="exportFormat">
          <option value="md">Markdown(.md)</option>
          <option value="txt">テキスト(.txt)</option>
          <option value="pdf">PDF(印刷画面から保存)</option>
        </select>
      </label>
      <label>中身
        <select id="exportScope">
          <option value="full">内部の判定つき(レビュー用)</option>
          <option value="visible">生徒の画面に出たやり取りだけ(採点用)</option>
        </select>
      </label>
      <button type="button" id="exportLogBtn" class="icon-btn">出力</button>
      <button type="button" id="copyLogBtn" class="icon-btn">コピー</button>
    </span>
    <span id="exportLogMsg" class="count" hidden>コピーしました</span>
    <div id="sessionHeader" class="s-header"></div>
    <div id="intakeBlock" class="notes-block" hidden></div>
    <div id="notesBlock" class="notes-block" hidden></div>
    <div id="safetyBlock" class="notes-block" hidden></div>
    <div id="flowBlock" class="notes-block" hidden></div>
    <div id="thread" class="thread"></div>
  </section>

  <div class="foot-note">
    このページには生徒の相談内容がそのまま表示されます。スクリーンショットやチャットへの貼り付け、
    画面の共有などをしないでください。相談内容は要配慮個人情報です。
  </div>
</main>
<script>
(function () {
  "use strict";

  // 合言葉はURLのクエリ文字列ではなく、ログインフォームで入力してもらう
  // (URL履歴・共有スクリーンショットに残らないようにするため)。
  // sessionStorageに保存し、同じタブを開いている間は再入力を求めない(タブを閉じれば消える)。
  var TOKEN_KEY = "sc_admin_token";
  var tokenStore = {
    get: function () { try { return sessionStorage.getItem(TOKEN_KEY) || ""; } catch (e) { return ""; } },
    set: function (v) { try { sessionStorage.setItem(TOKEN_KEY, v); } catch (e) { /* 保存できなくても続行する */ } },
    clear: function () { try { sessionStorage.removeItem(TOKEN_KEY); } catch (e) { /* noop */ } },
  };
  var token = tokenStore.get();

  var $ = function (sel) { return document.querySelector(sel); };
  var loginForm = $("#loginForm");
  var tokenInput = $("#tokenInput");
  var authError = $("#authError");
  var loadError = $("#loadError");
  var listView = $("#listView");
  var detailView = $("#detailView");
  var sessionListEl = $("#sessionList");
  var listEmpty = $("#listEmpty");
  var listCount = $("#listCount");
  var showLowPriorityCheckbox = $("#showLowPriority");
  var lowPriorityLabelEl = $("#lowPriorityLabel");
  var showSyntheticCheckbox = $("#showSynthetic");
  var syntheticLabelEl = $("#syntheticLabel");
  var sessionHeaderEl = $("#sessionHeader");
  var intakeBlockEl = $("#intakeBlock");
  var notesBlockEl = $("#notesBlock");
  var safetyBlockEl = $("#safetyBlock");
  var threadEl = $("#thread");
  var flowBlockEl = $("#flowBlock");
  var exportLogBtn = $("#exportLogBtn");
  var exportLogMsg = $("#exportLogMsg");
  var copyLogBtn = $("#copyLogBtn");
  var exportFormat = $("#exportFormat");
  var exportScope = $("#exportScope");
  var currentDetail = null; // ログ出力用に、開いているセッションのsession/messagesを保持する

  var WEIGHT_JA = { rapport: "関係をつくる", main: "主訴を見極める", goal: "目標を立てる", plan: "作戦会議" };
  var REL_JA = { visitor: "ビジター", complainant: "コンプレイナント", customer: "カスタマー" };
  var QL_JA = { none: "問わず受け止めのみ", data: "第1層・事実を聞く", diagnostic: "第2層・仮説を確かめる", confrontational: "第3層・見立てで介入" };
  var RL_JA = { listen: "相談を受ける", assess: "査定する", inform: "情報を提供する" };
  // 構造化面接AI統合 手順5。技法名は生徒には開示しないが、心理士向けのこの画面では表示してよい
  // (CLAUDE.md 5.9)。
  var MODE_JA = {
    CBT: "認知行動療法(CBT)", SFBT: "解決志向(SFBT)", NARRATIVE: "ナラティヴ",
    ASSERTION: "アサーション", LISTEN_ONLY: "傾聴", PROBLEM_SOLVING: "問題解決技法",
    PSYCHOEDUCATION: "心理教育・ノーマライズ",
  };
  // 主訴のカテゴリ(6 は 2026年10月14日に足した「どれに当てはまるかわからない」。src/intake.mjs の CATEGORY_JA と同じ)。
  // 危機の種類の CATEGORY_JA(下)と名前が重なって上書きされていたので、名前を分けた
  var COMPLAINT_JA = { 1: "友達・人間関係", 2: "勉強・進路・部活", 3: "家族・家のこと", 4: "自分の気持ちや性格", 5: "うまく言えない(なんとなくしんどい)", 6: "どれに当てはまるかわからない(未分類)" };
  var COMPLAINT_SOURCE_JA = { button: "本人がボタンで選んだ", estimated: "AIの推定" };
  // 構造化面接AI統合 手順7。closing_stateは11章のクロージング交渉の進み具合(sessions列)。
  var CLOSING_JA = {
    none: "なし", awaiting_choice: "続ける/区切るを確認中",
    confirmed_continue: "「続ける」を確認済み", closed: "区切り済み",
  };

  function esc(v) {
    return String(v === undefined || v === null ? "" : v).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function fmtDate(iso) {
    if (!iso) return "—";
    try {
      return new Date(iso).toLocaleString("ja-JP", {
        year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit",
      });
    } catch (e) { return iso; }
  }

  function showLoadError(msg) {
    loadError.hidden = false;
    loadError.textContent = "読み込みに失敗しました: " + msg;
  }

  function api(action, extra) {
    var payload = Object.assign({ action: action, admin_token: token }, extra || {});
    return fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    }).then(function (res) {
      return res.json().catch(function () { return null; }).then(function (body) {
        if (res.status === 401) {
          tokenStore.clear();
          authError.hidden = false;
          loginForm.hidden = false;
          listView.hidden = true;
          detailView.hidden = true;
          tokenInput.focus();
          throw new Error("unauthorized");
        }
        if (!res.ok) {
          throw new Error((body && body.error) || ("HTTP " + res.status));
        }
        return body;
      });
    });
  }

  var sessions = [];
  var sortMode = "new";
  var showLowPriority = false;
  // 合成データ(ペルソナテスト)は既定で隠す(2026年9月・ペルソナ多ターン回帰テスト
  // 新仕様)。研究データとして本物の生徒の会話と混同しないための表示切替。
  var showSynthetic = false;

  // 0往復(まだ何も起きていない)、または3往復以下でrelation/weightが初期値のまま
  // (=何も動いていない)、かつ危機でもないセッションを「低優先度」として扱う。
  // relation/weightが初期値から動いた時点で、たとえ短くても何らかの進展があった
  // とみなす(4節「対話設計」のrelation/weightをそのまま流用。新しい判定軸は作らない)。
  // has_crisisは常に優先表示するため、このフィルタの対象外にする。
  function isLowPriority(s) {
    if (s.has_crisis) return false;
    var turns = s.turn_count || 0;
    if (turns === 0) return true;
    return turns <= 3 && s.relation === "visitor" && s.weight === "rapport";
  }

  // 合成データはhas_crisisでも常に隠す(低優先度フィルタと違い、危機を装った
  // テスト用の発言が「本物の危機」として紛れ込んで見えることのほうが問題なため)。
  function isSynthetic(s) {
    return !!s.is_synthetic;
  }

  function renderList() {
    var lowPriorityCount = sessions.filter(isLowPriority).length;
    var syntheticCount = sessions.filter(isSynthetic).length;
    var visible = sessions.filter(function (s) {
      if (!showLowPriority && isLowPriority(s)) return false;
      if (!showSynthetic && isSynthetic(s)) return false;
      return true;
    });
    var sorted = visible.slice().sort(function (a, b) {
      if (sortMode === "unrated") return (b.unrated_count || 0) - (a.unrated_count || 0);
      return new Date(b.started_at) - new Date(a.started_at);
    });
    var hiddenNote = [];
    if (!showLowPriority && lowPriorityCount) hiddenNote.push("低優先度" + lowPriorityCount + "件");
    if (!showSynthetic && syntheticCount) hiddenNote.push("合成データ" + syntheticCount + "件");
    listCount.textContent = sessions.length
      ? visible.length + "件" + (hiddenNote.length ? "(" + hiddenNote.join("・") + "を非表示)" : "")
      : "";
    lowPriorityLabelEl.textContent = lowPriorityCount
      ? "やり取り0件、または3往復以下で進展が無く危機でもないセッション(" + lowPriorityCount + "件)を隠す"
      : "やり取り0件、または3往復以下で進展が無く危機でもないセッションを隠す(現在は該当なし)";
    syntheticLabelEl.textContent = syntheticCount
      ? "合成データ(ペルソナテスト。" + syntheticCount + "件)を表示する"
      : "合成データ(ペルソナテスト)を表示する(現在は該当なし)";
    listEmpty.hidden = sorted.length !== 0;
    listEmpty.textContent = (sorted.length === 0 && hiddenNote.length)
      ? hiddenNote.join("・") + "のみです。上のチェックを入れると表示されます。"
      : "まだセッションがありません。";
    sessionListEl.innerHTML = sorted.map(function (s) {
      var badges = "";
      if (s.is_synthetic) badges += '<span class="badge">テスト' + (s.persona_id ? "・" + esc(s.persona_id) : "") + '</span>';
      if (s.has_crisis) badges += '<span class="badge warn">危機</span>';
      if (!s.closed_at) badges += '<span class="badge open">進行中</span>';
      if (s.phase === "intake") badges += '<span class="badge">インテーク中</span>';
      if (s.unrated_count > 0) badges += '<span class="badge">未評価 ' + esc(s.unrated_count) + '</span>';
      return (
        '<div class="s-card' + (s.has_crisis ? " crisis" : "") + '" data-id="' + esc(s.id) + '">' +
          '<div class="s-card-top"><span class="s-id">#' + esc(s.client_id_short) + '</span>' + badges + '</div>' +
          '<div class="s-card-tags">' +
            '<span class="tag">' + esc(REL_JA[s.relation] || s.relation || "—") + '</span>' +
            '<span class="tag">' + esc(WEIGHT_JA[s.weight] || s.weight || "—") + '</span>' +
            '<span class="tag">' + esc(s.turn_count || 0) + '往復</span>' +
          '</div>' +
          '<div class="s-card-time">' + esc(fmtDate(s.started_at)) + ' 〜 ' +
            (s.closed_at ? esc(fmtDate(s.closed_at)) : "(継続中)") + '</div>' +
        '</div>'
      );
    }).join("");
  }

  function failureHtml(list) {

  function renderModelHealth(h) {
    var el = document.getElementById("modelHealth");
    if (!h || !h.h1) { el.hidden = true; return; }
    function part(label, w) {
      var sec = w.median_ms == null ? "—" : (w.median_ms / 1000).toFixed(1) + "秒";
      return label + ": 返事 " + w.replies + " / 429 " + w.rate_limited + " / 切り替え " + w.fallback + " / 失敗 " + w.failed + " / 時間 " + sec +
        (w.echo_rate == null ? "" : " / 冒頭の言い直し " + Math.round(w.echo_rate * 100) + "%") +
        (w.waiting_retry ? " / 作り直し待ち " + w.waiting_retry : "") + kindsText(w.failure_kinds);
    }
    // 生成の失敗の種類ごとの数(形の崩れ・長さの上限・安全フィルター・429・混雑・時間切れ。2026年11月4日)
    function kindsText(k) {
      var keys = k ? Object.keys(k) : [];
      return keys.length ? "(失敗の内訳 " + keys.map(function (x) { return x + " " + k[x]; }).join("・") + ")" : "";
    }

    el.hidden = false;

      parts.push('<span class="tag" title="' + esc((m.prompt_version || "") + (m.model ? " / " + m.model : "")) + '">版 ' + esc(ver + commit) + '</span>');
    }
    if (m.ending_variant) parts.push('<span class="tag">締めの文面 ' + esc(m.ending_variant) + '案目(仮)</span>');
    // 危機の状態で、固定の文面を出さずに指示つきの生成で返した応答(db/schema.sql 12節)
    if (m.crisis_generated) {
      var fallback = (m.flags || []).some(function (f) { return String(f).indexOf("危機の状態の生成→固定の返事") === 0; });
      parts.push('<span class="tag warn">危機の状態で生成(仮の指示)' + (fallback ? '→固定の返事に置き換え' : '') + '</span>');

  function ratingHtml(m) {

  // 連投のまとまり(2026年11月3日。db/schema.sql 17節): 続いた生徒の発言のうち、何通目か・全部で何通か
  function batchPositions(messages) {
    var pos = {};
    for (var i = 0; i < messages.length; i++) {
      if (messages[i].role !== "user") continue;
      var j = i;
      while (j + 1 < messages.length && messages[j + 1].role === "user") j++;
      for (var k = i; k <= j; k++) pos[k] = { n: k - i + 1, of: j - i + 1 };
      i = j;
    }
    return pos;
  }
  function timeOf(m) {
    if (!m.created_at) return "";
    var d = new Date(m.created_at);
    return isNaN(d) ? "" : d.toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  }
  var RISK_JA = { crisis: "危機", watch: "気がかり", none: "なし" };
  function renderMessages(messages) {
    var pos = batchPositions(messages);
    threadEl.innerHTML = messages.map(function (m, i) {
      if (m.role === "user") {
        // 連投のまとまり(2通以上)は、最初の発言の上に見出しを出し、1通ずつの時刻と判定を並べる
        var p = pos[i];
        var head = p && p.of > 1 && p.n === 1 ? '<div class="batch-head">連投のまとまり ' + p.of + '通(返事は1回)</div>' : "";
        var s = m.safety || null;
        var info = (p && p.of > 1) || s
          ? '<div class="batch-meta">' + (p && p.of > 1 ? p.n + "/" + p.of + "通目 " : "") + esc(timeOf(m)) +
            (s ? " ・判定 " + esc(RISK_JA[s.risk] || s.risk) + (s.subject === "other" ? "(第三者)" : "") +
              (s.notify_handled ? " ・通知" : "") + (s.skip ? " ・分類器にかけない(" + esc(s.skip) + ")" : "") : "") + '</div>'
          : "";
        // 生成に失敗して作り直しを待った発言には、失敗の印と記録を出す(2026年11月4日)
        var uflags = (m.flags || []).filter(function (f) { return String(f).indexOf("生成の失敗の内訳") === 0 || String(f).indexOf("失敗の詳細") === 0 || String(f).indexOf("モデルの切り替え") === 0; });
        var uf = uflags.length ? '<div class="flags">' + uflags.map(function (f) { return '<span class="tag warn">' + esc(f) + '</span>'; }).join("") + '</div>' : "";
        return head + '<div class="msg user"><div class="bubble">' + esc(m.body) + '</div></div>' + info + uf + failureHtml(m.failure);
      }
      var flags = (m.flags && m.flags.length)
        ? '<div class="flags">' + m.flags.map(function (f) { return '<span class="tag warn">' + esc(f) + '</span>'; }).join("") + '</div>'
        : "";
      return (
        '<div class="msg ai' + (m.crisis ? " crisis" : "") + (m.discomfort ? " discomfort" : "") + '">' +
          '<div class="bubble">' + esc(m.body) + '</div>' +
          (m.care_line ? '<div class="hint"><b>気づかいの一言(仮):</b> ' + esc(m.care_line) + '</div>' : "") +
          '<div class="meta">' + metaHtml(m) + '</div>' +
          '<div class="meta">' + flowTagsHtml(m) + '</div>' +
          (m.hypothesis ? '<div class="hint"><b>仮説:</b> ' + esc(m.hypothesis) + '</div>' : "") +
          (m.why ? '<div class="hint"><b>理由:</b> ' + esc(m.why) + '</div>' : "") +
          flags +
          failureHtml(m.failure) +
          knowledgeHtml(m.used) +
          ratingHtml(m) +
          discomfortHtml(m) +
        '</div>'
      );
    }).join("");
  }

        var reasons = Array.prototype.map.call(drow.querySelectorAll(".disc-reason.on"), function (b) { return b.dataset.r; });
        var note = drow.querySelector(".disc-note").value.trim();
        var reasonText = (reasons.length ? "[" + reasons.join("・") + "] " : "") + note;
        e.target.disabled = true;
        api("admin_mark_discomfort", { seq: Number(drow.dataset.seq), on: on, reason: reasonText }).then(function () {

  // ログ出力(構造化面接AI統合。00_統合版_構造化面接AIプロンプト.txt 9章「ログ出力ルール」を
  // 参考に、心理士向けレビュー画面用に実装。生徒向け画面(page.tsx)には技法名等の内部判断を

  // relation/weight/mode等を含めたMarkdown表として出力する。
  function mdEscape(v) {
    return String(v === undefined || v === null ? "" : v).replace(/\|/g, "\\|").replace(/\r?\n/g, "<br>");
  }

  function plainText(v) { return String(v === undefined || v === null ? "" : v); }

  // ---- ログの出力(2026年11月1日。Markdown・テキスト・PDF)----
  // 中身は2通り。full = 内部の判定つき(これまでの「ログを出力」と同じ表)/ visible = 生徒の画面に出たやり取りだけ
  // (scripts/export-review-logs.mjs と同じ考え方。内部の判定・版・日付・セッションのIDは書かない)。
  // PDF は依存のライブラリを足さず、印刷用のページを開いてブラウザの「PDF として保存」を使う。
  // 窓口の一覧は src/app/page.tsx の HOTLINES と同じ(変えたら合わせる)
  var EXPORT_HOTLINES = [
    ["24時間子供SOSダイヤル", "0120-0-78310"], ["チャイルドライン", "0120-99-7777"], ["よりそいホットライン", "0120-279-338"],
    ["こころの健康相談統一ダイヤル", "0570-064-556"], ["いますぐ危ないとき", "119"],
  ];
  var EXPORT_CLOSING_HOTLINES = EXPORT_HOTLINES.filter(function (h) { return h[0] !== "いますぐ危ないとき"; });
  function hotlineList(list) { return list.map(function (h) { return h[0] + " " + h[1]; }).join(" / "); }
  // 生徒の画面に、その AI の返事と一緒に出たもの(カード・選択肢)
  function visibleExtras(m) {
    var out = [];
    var card = m.safety_card || (m.crisis && m.crisis_step == null ? "crisis" : null);
    if (card === "crisis") out.push("〔窓口のカード〕" + hotlineList(EXPORT_HOTLINES));
    if (card === "care") out.push("〔気づかいのカード〕" + (plainText(m.care_line) || "気づかいの一言") + "(閉じた「話せる窓口」つき)");
    if (card === "hotlines") out.push("〔閉じた「話せる窓口」〕");
    if (m.closing) out.push("〔区切りのカード〕" + hotlineList(EXPORT_CLOSING_HOTLINES));
    if (m.choices && m.choices.length) out.push("〔選択肢〕" + m.choices.map(function (c) { return "[" + c.label + "]"; }).join(" "));
    return out;
  }
  // 1件ずつ { turn, speaker, body, extras, judgement } に並べる(md・txt・PDF で共通)
  function exportRows(detail, scope) {
    var turn = 0;
    var list = detail.messages || [];
    var pos = batchPositions(list);
    return list.map(function (m, i) {
      // 連投のまとまり(続いた生徒の発言)は1往復と数える(2026年11月3日)
      if (m.role === "user" && (i === 0 || list[i - 1].role !== "user")) turn++;
      var p = pos[i];
      var batchNote = p && p.of > 1 ? "・連投 " + p.n + "/" + p.of : "";
      var row = {
        turn: turn, speaker: m.role === "user" ? (m.choice_id ? "生徒(選択肢から" + batchNote + ")" : batchNote ? "生徒(" + batchNote.slice(1) + ")" : "生徒") : "AI",
        body: plainText(m.body).trim(), extras: m.role === "ai" ? visibleExtras(m) : [], judgement: "",
      };
      if (scope === "full" && m.role === "ai") row.judgement = judgementOf(m);
      return row;
    }).filter(function (r) { return r.body || r.extras.length; });
  }
  function judgementOf(m) {
    if (m.crisis) return "危機対応(固定応答)" + (m.flow_view ? " / 段階" + m.flow_view.stage : "");
    var parts = [];
    if (m.relation) parts.push("型:" + (REL_JA[m.relation] || m.relation));
    if (m.weight) parts.push("重心:" + (WEIGHT_JA[m.weight] || m.weight));
    if (m.question_level) parts.push("問い:" + (QL_JA[m.question_level] || m.question_level));
    if (m.role_kind) parts.push("役割:" + (RL_JA[m.role_kind] || m.role_kind));
    if (m.mode && m.mode.length) parts.push("モード:" + m.mode.map(function (mm) { return MODE_JA[mm] || mm; }).join("+"));
    if (m.closing) parts.push("クロージング要約");
    var v = m.flow_view;
    if (v) {
      parts.push("段階" + v.stage + ((v.basis || []).length ? "(" + v.basis.map(basisJa).join("・") + ")" : ""));
      if (v.receiveOnlyStreak != null) parts.push("受け止めのみ" + v.receiveOnlyStreak + "回続く / まとめから" + v.sinceSummary);
      if (v.move) parts.push("返し方:" + (MOVE_JA[v.move] || v.move));
    }
    if (m.flags && m.flags.length) parts.push("記録:" + m.flags.join("・"));
    if (m.discomfort) parts.push("違和感あり" + (m.discomfort_reason ? ":" + m.discomfort_reason : ""));
    return parts.join(" / ");
  }
  function headerLines(detail, scope) {
    if (scope === "visible") {
      return ["相談のやり取り", "(生徒の画面に表示されたやり取りだけ。画面の下には、いつも「119」「24時間子供SOSダイヤル」が表示されています)"];
    }
    var s = detail.session, out = ["相談ログ(" + plainText(s.client_id_short) + ")"];
    out.push("期間: " + fmtDate(s.started_at) + " 〜 " + (s.closed_at ? fmtDate(s.closed_at) : "(継続中)"));
    out.push("関わりの型: " + (REL_JA[s.relation] || s.relation || "—") + " / 重心: " + (WEIGHT_JA[s.weight] || s.weight || "—"));
    if (s.phase) out.push("フェーズ: " + (s.phase === "intake" ? "インテーク中" : "フェーズ2以降"));
    if (s.chief_complaint_category) out.push("主訴カテゴリ: " + (COMPLAINT_JA[s.chief_complaint_category] || s.chief_complaint_category)
      + (s.chief_complaint_source ? "(" + (COMPLAINT_SOURCE_JA[s.chief_complaint_source] || s.chief_complaint_source) + ")" : ""));
    if (s.onset_context) out.push("背景・きっかけ: " + s.onset_context);
    if (s.distress_level) out.push("つらさスケール: " + s.distress_level + " / 5");
    if (s.user_goal) out.push("期待するゴール: " + s.user_goal);
    if (s.recommended_mode && s.recommended_mode.length) out.push("判定モード: " + s.recommended_mode.map(function (m) { return MODE_JA[m] || m; }).join(" + "));
    if (s.closing_state && s.closing_state !== "none") out.push("クロージング: " + (CLOSING_JA[s.closing_state] || s.closing_state));
    return out;
  }
  var EXPORT_NOTE_FULL = "心理士向けレビュー用のログです。生徒本人には内部判断(型・重心・モード等)を開示していません。";
  var EXPORT_NOTE = "生徒の相談内容(要配慮個人情報)を含みます。共有・保存の場所に気をつけてください。";

  function buildExportMarkdown(detail, scope) {
    var h = headerLines(detail, scope), rows = exportRows(detail, scope), lines = ["# " + h[0], ""];
    h.slice(1).forEach(function (l) { lines.push(scope === "visible" ? l : "- " + l); });
    lines.push("");
    if (scope === "full") {
      lines.push("| Turn | 発話者 | 発話内容 | 内部判断(AIのみ) |", "|---|---|---|---|");
      rows.forEach(function (r) {
        var body = [r.body].concat(r.extras).filter(Boolean).join("\n");
        lines.push("| " + r.turn + " | " + r.speaker + " | " + mdEscape(body) + " | " + mdEscape(r.judgement) + " |");
      });
    } else {
      rows.forEach(function (r) {
        if (r.speaker !== "AI") lines.push("## " + r.turn, "");
        lines.push("**" + r.speaker + "**", "");
        if (r.body) lines.push(r.body.split(/\r?\n/).map(function (l) { return "> " + l; }).join("\n"), "");
        r.extras.forEach(function (x) { lines.push("　" + x, ""); });
      });
    }
    lines.push("", "_" + (scope === "full" ? "出力日時: " + fmtDate(new Date().toISOString()) + "。" + EXPORT_NOTE_FULL : "") + EXPORT_NOTE + "_");
    return lines.join("\n");
  }
  function buildExportText(detail, scope) {
    var h = headerLines(detail, scope), rows = exportRows(detail, scope), lines = [h[0], "=".repeat(20)];
    h.slice(1).forEach(function (l) { lines.push(l); });
    lines.push("");
    rows.forEach(function (r) {
      if (r.speaker !== "AI") lines.push("--- " + r.turn + " ---");
      lines.push("[" + r.speaker + "]");
      if (r.body) lines.push(r.body);
      r.extras.forEach(function (x) { lines.push("  " + x); });
      if (r.judgement) lines.push("  (内部判断: " + r.judgement + ")");
      lines.push("");
    });
    if (scope === "full") lines.push("出力日時: " + fmtDate(new Date().toISOString()) + "。" + EXPORT_NOTE_FULL);
    lines.push(EXPORT_NOTE);
    return lines.join("\n");
  }
  // PDF: 印刷用のページ(相談内容はすべてエスケープして入れる)を新しいタブで開き、印刷の画面を出す

  function downloadFile(content, ext, mime) {
    var blob = new Blob([content], { type: mime + ";charset=utf-8" });

    a.href = url;
    // 採点用(画面に出たやり取りだけ)は、ファイル名に ID・日付を入れない
    a.download = (exportScope.value === "visible" ? "conversation" : "log-" + plainText(currentDetail.session.client_id_short)) + "." + ext;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

    if (!currentDetail) return;
    var scope = exportScope.value;
    var text = exportFormat.value === "txt" ? buildExportText(currentDetail, scope) : buildExportMarkdown(currentDetail, scope);
    if (!(navigator.clipboard && navigator.clipboard.writeText)) { showExportMsg("この画面ではコピーできません。出力を使ってください"); return; }
    navigator.clipboard.writeText(text).then(function () { showExportMsg("コピーしました"); },
      function () { showExportMsg("コピーできませんでした。出力を使ってください"); });
  });

  $("#backBtn").addEventListener("click", function () {
    detailView.hidden = true;
    listView.hidden = false;
    loadError.hidden = true;
    currentDetail = null;
  });

  $("#refreshBtn").addEventListener("click", function () {
    if (!detailView.hidden) return;
    loadSessions();
  });

  loginForm.addEventListener("submit", function (e) {
    e.preventDefault();
    var v = tokenInput.value.trim();
    if (!v) return;
    token = v;
    tokenStore.set(v);
    authError.hidden = true;
    loginForm.hidden = true;
    loadSessions();
  });

  if (!token) {
    loginForm.hidden = false;
    tokenInput.focus();
  } else {
    loadSessions();
  }
})();
</script>
</body>
</html>
